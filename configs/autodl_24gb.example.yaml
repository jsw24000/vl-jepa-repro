model:
  backbone_name: vit_large
  vjepa_checkpoint: /root/autodl-tmp/models/vitl16.pth.tar
  freeze_vjepa: true
  image_size: 224
  num_frames: 16
  patch_size: 16
  tubelet_size: 2
  y_encoder_name: /root/autodl-tmp/models/embeddinggemma-300m
  predictor_hidden_dim: 2048
  predictor_depth: 2

data:
  train_manifest: /root/autodl-tmp/vl-jepa-repro/data/train_manifest.csv
  val_manifest: /root/autodl-tmp/vl-jepa-repro/data/val_manifest.csv
  batch_size: 2
  num_workers: 4

training:
  device: cuda
  epochs: 1
  learning_rate: 1.0e-4
  weight_decay: 0.05
  gradient_clip: 1.0
  log_every: 10
  output_dir: /root/autodl-tmp/vl-jepa-repro/outputs
  mixed_precision: true
